# 인스타그램 연결 토큰을 2주마다 갱신 (60일 만료 방지)
name: Instagram token refresh

on:
  schedule:
    - cron: '0 8 1,15 * *'   # 매달 1일과 15일 08:00 UTC (캘리포니아 자정~새벽 1시)
  workflow_dispatch:

concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 연결 준비 확인
        id: ready
        env:
          PASS: ${{ secrets.IG_TOKEN_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ] || [ ! -f data/ig-token.enc ]; then
            echo "인스타그램 연결이 아직 설정되지 않았습니다 — 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 토큰 갱신
        if: steps.ready.outputs.ready == 'true'
        env:
          IG_TOKEN_PASSPHRASE: ${{ secrets.IG_TOKEN_PASSPHRASE }}
        run: |
          OLD=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -base64 -pass env:IG_TOKEN_PASSPHRASE -in data/ig-token.enc)
          echo "::add-mask::$OLD"
          RES=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$OLD") || {
            echo "토큰 갱신 실패 — 인스타그램 연결을 다시 설정해야 할 수 있습니다."; echo "$RES"; exit 1; }
          NEW=$(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          printf '%s' "$NEW" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -base64 -pass env:IG_TOKEN_PASSPHRASE -out data/ig-token.enc
          echo "갱신 성공 (유효기간 60일 연장)"

      - name: 갱신된 토큰 저장
        if: steps.ready.outputs.ready == 'true'
        run: |
          if ! git diff --quiet data/ig-token.enc; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ig-token.enc
            git commit -m "chore: 인스타그램 토큰 갱신"
            git pull --rebase origin main
            git push origin main
          fi
